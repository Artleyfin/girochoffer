/* Formata um número em moeda brasileira. */
const fmt = (n) =>
  'R$ ' +
  Number(n).toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* Status "efetivo" de exibição: uma carga disponível com interessados
   aparece como "Com interessados". */
const dispStatus = (c) =>
  c.status === 'Disponível' && c.interessados.length > 0
    ? 'Com interessados'
    : c.status;

/* Estilo inline para o badge de status. */
const statusStyle = (label) => {
  const c = statusColors[label] || ['#5A6573', '#EDF0F4'];
  return {
    color: c[0],
    background: c[1],
    borderRadius: '999px',
    padding: '4px 12px',
    fontSize: '12px',
    fontWeight: 700,
    display: 'inline-block',
    whiteSpace: 'nowrap',
  };
};


// ===== src/utils/cargaVm.js =====

/* Monta os campos derivados de uma carga para exibição. */
function cargaVM(c, motoristas) {
  const statusLabel = dispStatus(c);
  const n = c.interessados.length;
  let interessadosLabel;
  if (c.escolhido && motoristas[c.escolhido]) {
    interessadosLabel = 'Motorista: ' + motoristas[c.escolhido].nome;
  } else if (n === 0) {
    interessadosLabel = 'Sem interessados ainda';
  } else {
    interessadosLabel = n + (n > 1 ? ' motoristas interessados' : ' motorista interessado');
  }
  return {
    ...c,
    statusLabel,
    valorFmt: fmt(c.valor),
    interessadosLabel,
  };
}


// ===== src/context/AppContext.jsx =====

const AppContext = createContext(null);

/* Usuário "logado" para fins do MVP. O motorista atual é sempre m1. */
const CURRENT_MOTORISTA = 'm1';

function AppProvider({ children }) {
  const [role, setRole] = useState(null); // 'empresa' | 'motorista' | null
  const [cargas, setCargas] = useState(cargasSeed);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 3400);
  }, []);

  /* ----- Ações sobre cargas ----- */
  const interesse = useCallback(
    (id) => {
      setCargas((cs) =>
        cs.map((c) =>
          c.id === id && !c.interessados.includes(CURRENT_MOTORISTA)
            ? { ...c, interessados: [...c.interessados, CURRENT_MOTORISTA] }
            : c
        )
      );
      showToast('Interesse enviado! O contato da empresa foi liberado.');
    },
    [showToast]
  );

  const escolher = useCallback(
    (id, mid) => {
      setCargas((cs) =>
        cs.map((c) =>
          c.id === id ? { ...c, escolhido: mid, status: 'Contratada' } : c
        )
      );
      const nome = motoristasData[mid] ? motoristasData[mid].nome : '';
      showToast(`${nome} foi contratado para o frete.`);
    },
    [showToast]
  );

  const concluir = useCallback(
    (id) => {
      setCargas((cs) =>
        cs.map((c) => (c.id === id ? { ...c, status: 'Concluída' } : c))
      );
      showToast('Frete marcado como concluído.');
    },
    [showToast]
  );

  const cancelarCarga = useCallback(
    (id) => {
      setCargas((cs) =>
        cs.map((c) => (c.id === id ? { ...c, status: 'Cancelada' } : c))
      );
      showToast('Carga cancelada.');
    },
    [showToast]
  );

  const publicar = useCallback(
    (nc) => {
      if (!nc.titulo || !nc.origem || !nc.destino) {
        showToast('Preencha ao menos título, origem e destino.');
        return false;
      }
      const carga = {
        id: 'n' + Date.now(),
        titulo: nc.titulo,
        empresa: usuarios.empresa.nome,
        empresaId: usuarios.empresa.id,
        mine: true,
        origem: nc.origem,
        destino: nc.destino,
        tipoVeiculo: nc.tipoVeiculo,
        carroceria: nc.carroceria,
        peso: nc.peso || '—',
        volume: '—',
        valor: Number(String(nc.valor).replace(/[^0-9]/g, '')) || 0,
        dataColeta: nc.dataColeta || 'A definir',
        descricao: nc.descricao || '—',
        status: 'Disponível',
        interessados: [],
        escolhido: null,
      };
      setCargas((cs) => [carga, ...cs]);
      showToast('Carga publicada com sucesso.');
      return true;
    },
    [showToast]
  );

  const value = {
    role,
    setRole,
    cargas,
    motoristas: motoristasData,
    opcoes: opcoesData,
    usuarios,
    currentMotorista: CURRENT_MOTORISTA,
    toast,
    showToast,
    interesse,
    escolher,
    concluir,
    cancelarCarga,
    publicar,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  const ctx = useContext(AppContext);
  if (!ctx) throw new Error('useApp deve ser usado dentro de <AppProvider>');
  return ctx;
}

/* Botão com suporte a estilo de hover (já que usamos estilos inline).
   Passe `style` para o estado normal e `hoverStyle` para o hover. */
function Button({ style, hoverStyle, children, ...props }) {
  const [hover, setHover] = useState(false);
  return (
    <button
      {...props}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{ ...style, ...(hover ? hoverStyle : null) }}
    >
      {children}
    </button>
  );
}

  return (
    <div
      style={{
        position: 'fixed',
        bottom: '28px',
        left: '50%',
        transform: 'translateX(-50%)',
        background: '#0B1B2B',

        padding: '14px 24px',
        borderRadius: '12px',

      }}
    >
      {toast}
    </div>
  );
}

  const { pathname } = useLocation();
  const { role, setRole, usuarios } = useApp();
  const isEmpresa = role === 'empresa';

  const navDefs = isEmpresa
    ? [
        ['Painel', '/empresa'],
        ['Nova carga', '/empresa/nova'],
        ['Meu perfil', '/perfil'],
      ]
    : [
        ['Cargas disponíveis', '/motorista'],
        ['Minhas cargas', '/motorista/minhas'],
        ['Meu perfil', '/perfil'],
      ];

  /* Marca o item ativo levando em conta as telas de detalhe. */
  const isActive = (path) => {
    if (path === '/empresa') return pathname === '/empresa' || pathname.startsWith('/empresa/carga');
    if (path === '/motorista') return pathname === '/motorista' || pathname.startsWith('/motorista/carga');
    return pathname === path;
  };

  const baseNav = {

function Campo({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: '12px', color: colors.muted2, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: '4px' }}>
        {label}
      </div>
      <div style={{ fontSize: '15px', color: colors.ink }}>{children}</div>
    </div>
  );
}

/* Cartão de detalhes da carga (coluna principal), compartilhado entre
   as telas de detalhe da empresa e do motorista. */
function CargaDetalheCard({ carga, statusLabel, subtitulo }) {
  return (
    <div style={{ background: '#fff', border: `1px solid ${colors.border}`, borderRadius: '16px', padding: '30px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '14px' }}>
        <StatusBadge label={statusLabel} />
        <span style={{ fontSize: '12px', color: colors.muted2 }}>Coleta {carga.dataColeta}</span>
      </div>
      <h1 style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: '26px', color: colors.inkStrong, margin: subtitulo ? '0 0 4px' : '0 0 22px' }}>
        {carga.titulo}
      </h1>
      {subtitulo && <div style={{ fontSize: '14px', color: colors.muted, marginBottom: '24px' }}>{subtitulo}</div>}

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px', marginBottom: '24px' }}>
        <Campo label="Origem">
          <span style={{ fontSize: '16px', fontWeight: 700, color: colors.navy }}>{carga.origem}</span>
        </Campo>
        <Campo label="Destino">
          <span style={{ fontSize: '16px', fontWeight: 700, color: colors.navy }}>{carga.destino}</span>
        </Campo>
        <Campo label="Veículo / Carroceria">
          {carga.tipoVeiculo} · {carga.carroceria}
        </Campo>
        <Campo label="Peso / Volume">
          {carga.peso} · {carga.volume}
        </Campo>
      </div>

      <div style={{ fontSize: '12px', color: colors.muted2, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.4px', marginBottom: '6px' }}>
        Descrição
      </div>
      <p style={{ fontSize: '15px', color: '#4A5462', lineHeight: 1.6, margin: 0 }}>{carga.descricao}</p>
    </div>
  );
}

/* Card de motorista interessado, exibido nos detalhes da carga (empresa). */
function MotoristaInteressadoCard({ motorista, escolhido, podeEscolher, onEscolher }) {

  return (
    <div
      style={{
        background: '#fff',
        border: `1px solid ${escolhido ? '#CDE8D9' : colors.border}`,
        borderRadius: '14px',
        padding: '18px 20px',
        display: 'flex',
        alignItems: 'center',
        gap: '18px',
      }}
    >
      <div
        style={{
          width: '48px',
          height: '48px',
          borderRadius: '50%',
          background: colors.tintBlue,
          color: colors.navy,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          fontWeight: 800,
          fontSize: '16px',
          fontFamily: fonts.heading,
          flex: 'none',
        }}
      >
        {m.inicial}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontWeight: 700, fontSize: '16px', color: colors.ink, marginBottom: '3px' }}>{m.nome}</div>
        <div style={{ fontSize: '13px', color: colors.muted }}>
          {m.veiculo} · {m.carroceria} · até {m.cap}
        </div>
        <div style={{ fontSize: '13px', color: colors.muted, marginTop: '2px' }}>
          {m.cidade} · ⭐ {m.nota} · {m.viagens} viagens
        </div>
      </div>
      {escolhido && (
        <span
          style={{
            background: '#E3F4EC',
            color: '#1E8E5A',
            fontWeight: 700,
            fontSize: '13px',
            padding: '9px 16px',
            borderRadius: '9px',
            flex: 'none',
          }}
        >
          ✓ Contratado
        </span>
      )}
      {podeEscolher && (
        <Button
          onClick={onEscolher}
          style={{
            padding: '11px 22px',
            background: colors.primary,
            color: '#fff',
            border: 'none',
            borderRadius: '10px',
            fontWeight: 700,
            fontSize: '14px',
            cursor: 'pointer',
            flex: 'none',
          }}
          hoverStyle={{ background: colors.primaryHover }}
        >
          Escolher
        </Button>
      )}
    </div>
  );
}

/* Linha compacta de carga usada em "Minhas cargas" (motorista).
   `pill` define o rótulo/cores do status e `verButton` exibe o botão Ver. */
function CargaResumoRow({ carga, pill, borderColor = colors.border, dimmed = false, verButton = false }) {
  const navigate = useNavigate();
  return (
    <div
      style={{
        background: '#fff',
        border: `1px solid ${borderColor}`,
        borderRadius: '13px',
        padding: '18px 20px',
        display: 'flex',
        alignItems: 'center',
        gap: '20px',
        opacity: dimmed ? 0.86 : 1,
      }}
    >
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 700, fontSize: '16px', color: colors.ink, marginBottom: '4px' }}>{carga.titulo}</div>
        <div style={{ fontSize: '14px', color: '#4A5462' }}>
          <span style={{ fontWeight: 700, color: colors.navy }}>{carga.origem}</span> →{' '}
          <span style={{ fontWeight: 700, color: colors.navy }}>{carga.destino}</span> · {carga.empresa}
        </div>
      </div>
      <div style={{ fontFamily: "'Archivo', sans-serif", fontWeight: 800, fontSize: '18px', color: colors.navy }}>
        {fmt(carga.valor)}
      </div>
      <span
        style={{
          background: pill.bg,
          color: pill.color,
          fontWeight: 700,
          fontSize: '12px',
          padding: '6px 12px',
          borderRadius: '999px',
        }}
      >
        {pill.label}
      </span>
      {verButton && (
        <button
          onClick={() => navigate(`/motorista/carga/${carga.id}`)}
          style={{
            padding: '9px 16px',
            background: '#fff',
            color: colors.ink,
            border: `1px solid ${colors.borderInput}`,
            borderRadius: '9px',
            fontWeight: 600,
            fontSize: '13px',
            cursor: 'pointer',
          }}
        >
          Ver
        </button>
      )}
    </div>
  );
}

          </h1>
          <p style={{ fontSize: '18px', lineHeight: 1.6, color: '#4A5462', margin: '0 0 32px', maxWidth: '520px' }}>

          </p>
          <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
            <Button onClick={() => navigate('/entrar?modo=cadastro&papel=empresa')} style={{ padding: '15px 30px', background: colors.primary, color: '#fff', border: 'none', borderRadius: '12px', fontWeight: 700, fontSize: '16px', cursor: 'pointer' }} hoverStyle={{ background: colors.primaryHover }}>
              Sou empresa
            </Button>
            <Button onClick={() => navigate('/entrar?modo=cadastro&papel=motorista')} style={{ padding: '15px 30px', background: colors.navy, color: '#fff', border: 'none', borderRadius: '12px', fontWeight: 700, fontSize: '16px', cursor: 'pointer' }} hoverStyle={{ background: colors.navyHover }}>
              Sou motorista

          </div>

            {stats.map(([v, l]) => (

                <div style={{ fontSize: '13px', color: colors.muted }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ aspectRatio: '4 / 3', borderRadius: '18px', background: 'repeating-linear-gradient(135deg,#E9EEF4 0 14px,#EFF3F7 14px 28px)', border: `1px solid ${colors.borderSoft}`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>

const tabDefs = [
  ['todas', 'Todas'],
  ['Disponível', 'Disponíveis'],
  ['Com interessados', 'Com interessados'],
  ['Contratada', 'Contratadas'],
  ['Concluída', 'Concluídas'],
];

function StatCard({ value, label, color }) {
  return (
    <div style={{ background: '#fff', border: `1px solid ${colors.border}`, borderRadius: '14px', padding: '20px' }}>
      <div style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: '32px', color }}>{value}</div>
      <div style={{ fontSize: '13px', color: colors.muted, marginTop: '2px' }}>{label}</div>
    </div>
  );
}

function EmpresaPainel() {
  const navigate = useNavigate();
  const { cargas } = useApp();
  const [tab, setTab] = useState('todas');

  const mine = cargas.filter((c) => c.mine);
  const stats = {
    disp: mine.filter((c) => c.status === 'Disponível' && c.interessados.length === 0).length,
    inter: mine.filter((c) => c.status === 'Disponível' && c.interessados.length > 0).length,
    contr: mine.filter((c) => c.status === 'Contratada').length,
    concl: mine.filter((c) => c.status === 'Concluída').length,
  };

  let list = mine;
  if (tab !== 'todas') list = mine.filter((c) => dispStatus(c) === tab);

  return (
    <div style={{ maxWidth: '1160px', margin: '0 auto', padding: '36px 32px 64px' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: '20px', marginBottom: '28px', flexWrap: 'wrap' }}>
        <div>
          <h1 style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: '30px', color: colors.inkStrong, margin: '0 0 4px' }}>Painel da empresa</h1>
          <p style={{ margin: 0, color: colors.muted, fontSize: '15px' }}>Acompanhe suas cargas publicadas e os motoristas interessados.</p>
        </div>
        <Button onClick={() => navigate('/empresa/nova')} style={{ padding: '13px 24px', background: colors.primary, color: '#fff', border: 'none', borderRadius: '11px', fontWeight: 700, fontSize: '15px', cursor: 'pointer' }} hoverStyle={{ background: colors.primaryHover }}>
          + Publicar nova carga
        </Button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '16px', marginBottom: '28px' }}>
        <StatCard value={stats.disp} label="Disponíveis" color={colors.primary} />
        <StatCard value={stats.inter} label="Com interessados" color="#B7791F" />
        <StatCard value={stats.contr} label="Contratadas" color="#1E8E5A" />
        <StatCard value={stats.concl} label="Concluídas" color={colors.muted3} />
      </div>

      <div style={{ display: 'flex', gap: '8px', marginBottom: '20px', flexWrap: 'wrap' }}>
        {tabDefs.map(([key, label]) => {
          const on = tab === key;
          return (
            <button
              key={key}
              onClick={() => setTab(key)}
              style={{
                padding: '8px 16px',
                borderRadius: '999px',
                border: `1px solid ${on ? colors.primary : colors.border}`,
                background: on ? colors.primary : '#fff',
                color: on ? '#fff' : colors.muted3,
                fontWeight: 600,
                fontSize: '13px',
                cursor: 'pointer',
              }}
            >
              {label}
            </button>
          );
        })}
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
        {list.map((c) => (
          <CargaCardEmpresa key={c.id} carga={c} />
        ))}
      </div>
      {list.length === 0 && <EmptyState>Nenhuma carga neste status.</EmptyState>}
    </div>
  );
}

const initial = {
  titulo: '',
  origem: '',
  destino: '',

  peso: '',
  valor: '',
  dataColeta: '',
  descricao: '',
};

  const navigate = useNavigate();
  const { opcoes, publicar } = useApp();
  const [form, setForm] = useState(initial);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const onPublicar = () => {
    if (publicar(form)) navigate('/empresa');

  return (
    <div style={{ maxWidth: '760px', margin: '0 auto', padding: '36px 32px 64px' }}>

          <TextInput label="Origem" value={form.origem} onChange={set('origem')} placeholder="Cidade/UF" />

              <option key={v} value={v}>{v}</option>
            ))}

function EmpresaDetalhes() {
  const { id } = useParams();
  const navigate = useNavigate();
  const { cargas, motoristas, escolher, concluir, cancelarCarga } = useApp();

  const carga = cargas.find((c) => c.id === id) || cargas[0];
  const statusLabel = dispStatus(carga);
  const isContratada = carga.status === 'Contratada';
  const isDisponivel = carga.status === 'Disponível';

  const interessados = carga.interessados.map((mid) => motoristas[mid]).filter(Boolean);

  return (
    <div style={{ maxWidth: '1000px', margin: '0 auto', padding: '36px 32px 64px' }}>
      <button onClick={() => navigate('/empresa')} style={{ background: 'none', border: 'none', color: colors.muted, fontWeight: 600, fontSize: '14px', cursor: 'pointer', padding: 0, marginBottom: '16px' }}>
        ← Voltar ao painel
      </button>

      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: '24px', alignItems: 'start' }}>
        <CargaDetalheCard carga={carga} statusLabel={statusLabel} />

        <div>
          <div style={{ background: colors.navy, borderRadius: '16px', padding: '26px', color: '#fff', marginBottom: '18px' }}>
            <div style={{ fontSize: '13px', color: '#9FC2E0', marginBottom: '4px' }}>Valor do frete</div>
            <div style={{ fontFamily: fonts.heading, fontWeight: 900, fontSize: '36px', lineHeight: 1 }}>{fmt(carga.valor)}</div>
          </div>

          {isContratada && (
            <div style={{ background: '#fff', border: `1px solid ${colors.border}`, borderRadius: '14px', padding: '20px' }}>
              <div style={{ fontSize: '13px', fontWeight: 700, color: '#1E8E5A', marginBottom: '12px' }}>✓ Carga contratada</div>
              <button onClick={() => concluir(carga.id)} style={{ width: '100%', padding: '13px', background: '#1E8E5A', color: '#fff', border: 'none', borderRadius: '10px', fontWeight: 700, fontSize: '15px', cursor: 'pointer', marginBottom: '10px' }}>
                Marcar como concluída
              </button>
              <button onClick={() => cancelarCarga(carga.id)} style={{ width: '100%', padding: '13px', background: '#fff', color: '#C0392B', border: '1px solid #F0D2CE', borderRadius: '10px', fontWeight: 600, fontSize: '14px', cursor: 'pointer' }}>
                Cancelar carga
              </button>
            </div>
          )}
          {isDisponivel && (
            <div style={{ background: '#fff', border: `1px solid ${colors.border}`, borderRadius: '14px', padding: '20px' }}>
              <button onClick={() => cancelarCarga(carga.id)} style={{ width: '100%', padding: '13px', background: '#fff', color: '#C0392B', border: '1px solid #F0D2CE', borderRadius: '10px', fontWeight: 600, fontSize: '14px', cursor: 'pointer' }}>
                Cancelar carga
              </button>
            </div>
          )}
        </div>
      </div>

      <div style={{ marginTop: '32px' }}>
        <h2 style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: '20px', color: colors.inkStrong, margin: '0 0 16px' }}>Motoristas interessados</h2>
        {interessados.length === 0 ? (
          <EmptyState padding="40px">Ainda não há motoristas interessados nesta carga.</EmptyState>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
            {interessados.map((m) => (
              <MotoristaInteressadoCard
                key={m.id}
                motorista={m}
                escolhido={carga.escolhido === m.id}
                podeEscolher={!carga.escolhido}
                onEscolher={() => escolher(carga.id, m.id)}
              />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const inputStyle = {
  width: '100%',
  padding: '10px 13px',
  border: `1px solid ${colors.borderInput}`,
  borderRadius: '9px',
  fontSize: '14px',
  background: '#fff',
};
const lblStyle = { display: 'block', fontSize: '12px', fontWeight: 600, color: colors.muted, marginBottom: '6px' };

function MotoristaPainel() {
  const { cargas, opcoes } = useApp();
  const [filtro, setFiltro] = useState({ origem: '', destino: '', carroceria: '' });

  const set = (k) => (e) => setFiltro((f) => ({ ...f, [k]: e.target.value }));
  const limpar = () => setFiltro({ origem: '', destino: '', carroceria: '' });

  let market = cargas.filter((c) => c.status === 'Disponível');
  if (filtro.origem.trim()) market = market.filter((c) => c.origem.toLowerCase().includes(filtro.origem.toLowerCase().trim()));
  if (filtro.destino.trim()) market = market.filter((c) => c.destino.toLowerCase().includes(filtro.destino.toLowerCase().trim()));
  if (filtro.carroceria) market = market.filter((c) => c.carroceria === filtro.carroceria);

  return (
    <div style={{ maxWidth: '1160px', margin: '0 auto', padding: '36px 32px 64px' }}>
      <h1 style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: '30px', color: colors.inkStrong, margin: '0 0 4px' }}>Cargas disponíveis</h1>
      <p style={{ margin: '0 0 24px', color: colors.muted, fontSize: '15px' }}>Encontre fretes compatíveis e demonstre seu interesse.</p>

      <div style={{ background: '#fff', border: `1px solid ${colors.border}`, borderRadius: '14px', padding: '18px 20px', display: 'flex', gap: '14px', alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: '24px' }}>
        <div style={{ flex: 1, minWidth: '160px' }}>
          <label style={lblStyle}>Origem</label>
          <input value={filtro.origem} onChange={set('origem')} placeholder="Cidade ou UF" style={inputStyle} />
        </div>
        <div style={{ flex: 1, minWidth: '160px' }}>
          <label style={lblStyle}>Destino</label>
          <input value={filtro.destino} onChange={set('destino')} placeholder="Cidade ou UF" style={inputStyle} />
        </div>
        <div style={{ flex: 1, minWidth: '180px' }}>
          <label style={lblStyle}>Carroceria</label>
          <select value={filtro.carroceria} onChange={set('carroceria')} style={{ ...inputStyle, ...selectArrow }}>
            <option value="">Todas as carrocerias</option>
            {opcoes.carrocerias.map((v) => (
              <option key={v} value={v}>{v}</option>
            ))}
          </select>
        </div>
        <button onClick={limpar} style={{ padding: '10px 18px', background: '#F1F4F8', color: colors.muted, border: 'none', borderRadius: '9px', fontWeight: 600, fontSize: '14px', cursor: 'pointer', height: '40px' }}>
          Limpar
        </button>
      </div>

      <div style={{ fontSize: '14px', color: colors.muted, marginBottom: '14px' }}>{market.length} carga(s) encontrada(s)</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
        {market.map((c) => (
          <CargaCardMercado key={c.id} carga={c} />
        ))}
      </div>
      {market.length === 0 && <EmptyState>Nenhuma carga corresponde aos filtros.</EmptyState>}
    </div>
  );
}

function MotoristaMinhas() {
  const { cargas, currentMotorista } = useApp();
  const me = currentMotorista;

  const enviados = cargas.filter((c) => c.interessados.includes(me) && c.escolhido !== me && c.status === 'Disponível');
  const contratadas = cargas.filter((c) => c.escolhido === me && c.status === 'Contratada');
  const concluidas = cargas.filter((c) => c.escolhido === me && c.status === 'Concluída');

  return (
    <div style={{ maxWidth: '1000px', margin: '0 auto', padding: '36px 32px 64px' }}>

}

   solicitar (e-mail) → enviado (confirmação) → redefinir (código + nova senha). */

  const navigate = useNavigate();
  const { showToast } = useApp();

    width: '100%',

/* Protege rotas que exigem um papel específico. Sem papel ativo,
   redireciona para a tela de login. */
function Require({ role, children }) {
  const { role: active } = useApp();
  if (!active) return <Navigate to="/entrar" replace />;
  if (role && active !== role) {
    return <Navigate to={active === 'empresa' ? '/empresa' : '/motorista'} replace />;
  }
  return children;
}

function App() {
  return (
    <>
      <Routes>
        {/* Públicas */}
        <Route path="/" element={<Landing />} />
        <Route path="/entrar" element={<Auth />} />
        <Route path="/recuperar-senha" element={<RecuperarSenha />} />

        {/* Área autenticada (com header) */}
        <Route element={<AppLayout />}>
          <Route
            path="/empresa"
            element={
              <Require role="empresa">
                <EmpresaPainel />
              </Require>
            }
          />
          <Route
            path="/empresa/nova"
            element={
              <Require role="empresa">
                <EmpresaNovaCarga />
              </Require>
            }
          />
          <Route
            path="/empresa/carga/:id"
            element={
              <Require role="empresa">
                <EmpresaDetalhes />
              </Require>
            }
          />
          <Route
            path="/motorista"
            element={
              <Require role="motorista">
                <MotoristaPainel />
              </Require>
            }
          />
          <Route
            path="/motorista/carga/:id"
            element={
              <Require role="motorista">
                <MotoristaDetalhes />
              </Require>
            }
          />
          <Route
            path="/motorista/minhas"
            element={
              <Require role="motorista">
                <MotoristaMinhas />
              </Require>
            }
          />
          <Route
            path="/perfil"
            element={
              <Require>
                <Perfil />
              </Require>
            }
          />
        </Route>

        <Route path="*" element={<Navigate to="/" replace />} />
      </Routes>
      <Toast />
    </>
  );
}



createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null,
    React.createElement(BrowserRouter, null,
      React.createElement(AppProvider, null,
        React.createElement(App, null)))));

</script>
<script>
/* Transpila o JSX com Babel (mantendo os import/export do módulo) e
   executa o resultado como um módulo ES real via blob URL, para que o
   import map (React 19 + React Router 8) seja respeitado. */
window.addEventListener('DOMContentLoaded', function () {
  function showErr(e) {
    document.getElementById('root').innerHTML =
      '<pre style="padding:24px;color:#c0392b;font-family:monospace;white-space:pre-wrap">' +
      (e && e.message ? e.message : e) + '</pre>';
    console.error(e);
  }
  try {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: ['react'], sourceType: 'module' }).code;
    var url = URL.createObjectURL(new Blob([out], { type: 'text/javascript' }));
    import(url).catch(showErr);
  } catch (e) {
    showErr(e);
  }
});
</script>
</body>
